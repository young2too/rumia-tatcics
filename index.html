<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="DFuO-Q-m7WhMiR0HLwm5fpxKUXKMtDRrRl1y8hr_3Co" />
    <title>루미아 택틱스 - 이터널 리턴 오토체스 | 블토체스·이리체스</title>
    <meta name="description" content="블토체스·이리체스로 불리는 이터널 리턴 팬 웹게임 루미아 택틱스. 캐릭터를 모아 배치하고 다양한 시너지와 히든 조합으로 보스와 무한 라운드에 도전하세요." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#11191b" />
    <link rel="canonical" href="https://rumia-tatcics.onrender.com/" />
    <link rel="icon" href="./assets/characters/000_Dr.Nadja.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="루미아 택틱스" />
    <meta property="og:title" content="루미아 택틱스 - 이터널 리턴 오토체스" />
    <meta property="og:description" content="블토체스·이리체스: 이터널 리턴 캐릭터로 즐기는 팬 웹 오토체스 게임" />
    <meta property="og:url" content="https://rumia-tatcics.onrender.com/" />
    <meta property="og:image" content="https://rumia-tatcics.onrender.com/assets/characters/000_Dr.Nadja.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="루미아 택틱스 - 이터널 리턴 오토체스" />
    <meta name="twitter:description" content="블토체스·이리체스: 캐릭터와 시너지로 즐기는 팬 웹 오토체스" />
    <meta name="twitter:image" content="https://rumia-tatcics.onrender.com/assets/characters/000_Dr.Nadja.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "루미아 택틱스",
        "alternateName": ["Lumia Tactics", "블토체스", "이리체스"],
        "description": "이터널 리턴 캐릭터로 조합과 시너지를 구성하는 팬 웹 오토체스 게임",
        "url": "https://rumia-tatcics.onrender.com/",
        "image": "https://rumia-tatcics.onrender.com/assets/characters/000_Dr.Nadja.png",
        "inLanguage": "ko",
        "applicationCategory": "Game",
        "operatingSystem": "Web Browser",
        "isAccessibleForFree": true
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260625-shield-bar" />
  </head>
  <body>
    <main class="app">
      <section class="topbar" aria-label="game status">
        <div class="brand">
          <span class="brand-mark"><img src="./assets/characters/000_Dr.Nadja.png" alt="Lumia Tactics" /></span>
          <div>
            <h1>Lumia Tactics</h1>
            <p>이터널 리턴 캐릭터 팬 오토체스 · 블토체스 · 이리체스</p>
          </div>
          <nav class="brand-actions" aria-label="주요 메뉴">
            <button id="bgmToggle" class="audio-button" title="배경음악 켜기">BGM</button>
            <button id="patchNotesToggle" class="patch-notes-button" title="패치노트 보기">패치노트</button>
            <button id="rankingToggle" class="ranking-button" title="랭킹 보기">랭킹</button>
            <a class="pvp-rooms-button" href="./pvp.html" title="PvP 방 목록 보기" hidden aria-hidden="true" tabindex="-1">PvP</a>
            <a class="statistics-button" href="./stats.html" title="통계 보기">통계</a>
            <button id="communityBoardToggle" class="community-board-button" title="게시판 보기">게시판</button>
          </nav>
        </div>
        <div class="stats">
          <div><span>라운드</span><strong id="round">1</strong></div>
          <div><span>체력</span><strong id="hp">100</strong></div>
          <div class="level-stat">
            <span>레벨</span>
            <strong id="level">1</strong>
            <small id="levelXp">0 / 2 XP</small>
            <i id="levelXpBar"></i>
          </div>
          <div><span>흐름</span><strong id="streak">-</strong><small id="income">수입 +0</small></div>
        </div>
      </section>

      <section class="main-grid">
        <aside class="panel left-panel">
          <div class="panel-title">
            <h2>시너지</h2>
            <div class="trait-panel-tools">
              <button id="hiddenTraitToggle" class="hidden-trait-button active" type="button" title="달성한 히든 시너지 숨기기">히든 ON</button>
              <button id="traitTableToggle" class="trait-table-button" title="전체 시너지 표 보기">시너지 표</button>
            </div>
          </div>
          <div id="traits" class="traits"></div>
          <div class="log-wrap">
            <h2>전투 로그</h2>
            <div id="log" class="log"></div>
          </div>
        </aside>

        <section class="board-wrap">
          <div class="arena-head">
            <div>
              <h2>루미아 섬 전장</h2>
              <p id="phase">준비 단계: 상점에서 영입하고 보드에 배치하세요.</p>
            </div>
            <div class="actions">
              <button id="levelUp">4XP 구매</button>
              <button id="battle" class="primary">전투 시작</button>
            </div>
          </div>
          <div class="battlefield" aria-label="auto chess board">
            <div id="boardCapacity" class="board-capacity" aria-hidden="true">
              <strong id="boardCapacityMain">0/1</strong>
              <span id="boardCapacitySub"></span>
            </div>
            <button id="augmentResumeCenter" class="augment-resume-center" type="button" data-augment-reopen hidden>
              증강 선택
            </button>
            <div id="activeAugments" class="active-augments" hidden></div>
            <div id="enemyBoard" class="enemy-board"></div>
            <div id="board" class="board"></div>
            <div class="field-xp" aria-hidden="true"><i id="fieldXpBar"></i></div>
          </div>
          <div class="bench-wrap">
            <div class="bench-head">
              <h2>벤치</h2>
              <div class="bench-actions">
                <div id="temporaryBoosts" class="temporary-boosts" aria-label="다음 전투 일시 강화"></div>
                <span id="benchCount">0/8</span>
              </div>
            </div>
            <div id="bench" class="bench"></div>
          </div>
        </section>

        <aside class="panel shop-panel">
          <div class="panel-title">
            <h2>상점</h2>
            <div class="shop-tools">
              <button id="oddsToggle" class="odds-toggle" title="상점 확률표">확률표</button>
              <button id="shopLock" class="shop-lock" title="상점 잠금">잠금 해제</button>
              <button id="reroll" class="shop-reroll" title="상점 새로고침">2크레딧 리롤</button>
            </div>
          </div>
          <div class="shop-panel-tabs" role="tablist" aria-label="상점 패널">
              <button id="shopTabShop" class="active" type="button" data-shop-panel-tab="shop">상점</button>
              <button id="shopTabMetrics" type="button" data-shop-panel-tab="metrics">전투 지표</button>
          </div>
          <div id="shopContent" class="shop-content">
            <div class="shop-wallet">
              <span>보유 크레딧</span>
              <strong id="gold">1</strong>
            </div>
            <div id="debugShop" class="debug-shop" hidden>
              <label for="debugUnitSearch">디버그 기물 영입</label>
              <div>
                <input id="debugUnitSearch" list="debugUnitList" placeholder="캐릭터 이름 검색" autocomplete="off" />
                <datalist id="debugUnitList"></datalist>
                <button id="debugRecruitUnit" type="button">즉시 영입</button>
              </div>
              <div class="debug-dummy-tools">
                <button id="debugDummyToggle" type="button">더미 배치 OFF</button>
                <button id="debugDummyClear" type="button">더미 초기화</button>
              </div>
              <div class="debug-round-tools">
                <label for="debugRoundInput">라운드 점프</label>
                <div>
                  <input id="debugRoundInput" type="number" min="1" max="999" step="1" value="15" />
                  <button id="debugRoundJump" type="button">이동</button>
                </div>
                <div class="debug-round-presets" aria-label="라운드 빠른 이동">
                  <button type="button" data-debug-round="15">15R</button>
                  <button type="button" data-debug-round="30">30R</button>
                  <button type="button" data-debug-round="60">60R</button>
                  <button type="button" data-debug-round="90">90R</button>
                </div>
              </div>
              <div class="debug-augment-tools">
                <label>증강 테스트</label>
                <div>
                  <input id="debugAugmentSearch" list="debugAugmentList" placeholder="증강 이름 검색" autocomplete="off" />
                  <datalist id="debugAugmentList"></datalist>
                  <button id="debugSelectAugment" type="button">즉시 선택</button>
                </div>
                <div>
                  <button type="button" data-debug-augment-stage="1">1단계</button>
                  <button type="button" data-debug-augment-stage="2">2단계</button>
                  <button type="button" data-debug-augment-stage="3">3단계</button>
                </div>
              </div>
            </div>
            <div id="shop" class="shop"></div>
            <div id="oddsPopover" class="shop-odds" hidden>
              <div class="panel-title">
                <h2>상점 확률</h2>
                <span>기물 풀</span>
              </div>
              <div id="shopOdds" class="odds-grid"></div>
            </div>
          </div>
          <div id="combatMetrics" class="combat-metrics" hidden></div>
          <div class="unit-detail">
            <div class="panel-title">
              <h2>유닛 정보</h2>
              <span id="detailTier">선택 없음</span>
            </div>
            <div id="unitDetail" class="detail-body"></div>
            <button id="sellUnit" class="sell-unit" disabled>판매</button>
          </div>
        </aside>
      </section>

      <div id="rankingModal" class="ranking-modal" hidden>
        <section class="ranking-dialog" role="dialog" aria-modal="true" aria-labelledby="rankingTitle">
          <div class="panel-title">
            <h2 id="rankingTitle">랭킹</h2>
            <label class="ranking-version-filter">
              <span>버전:</span>
              <select id="rankingVersionFilter">
                <option value="all">통합랭킹</option>
              </select>
            </label>
            <div class="ranking-sort-controls" aria-label="랭킹 정렬">
              <button id="rankingSortStage" type="button" class="active">라운드 ↓</button>
              <button id="rankingSortRecent" type="button">최신 ↓</button>
            </div>
            <button id="rankingClose" class="icon-button" title="닫기">닫기</button>
          </div>
          <div id="rankSubmit" class="rank-submit" hidden>
            <p>체력이 0이 된 시점의 기록을 등록할 수 있습니다.</p>
            <div>
              <input id="rankName" maxlength="12" placeholder="닉네임" />
              <button id="rankSave">등록</button>
            </div>
          </div>
          <div id="rankingPanel" class="ranking-panel"></div>
        </section>
      </div>

      <div id="patchNotesModal" class="patch-notes-modal" hidden>
        <section class="patch-notes-dialog" role="dialog" aria-modal="true" aria-labelledby="patchNotesTitle">
          <div class="panel-title">
            <div>
              <h2 id="patchNotesTitle">패치노트</h2>
              <span id="patchNotesMeta"></span>
            </div>
            <button id="patchNotesClose" class="icon-button" title="닫기">닫기</button>
          </div>
          <div id="patchNotesBody" class="patch-notes-body"></div>
          <label class="patch-notes-option">
            <input id="patchNotesSkipToday" type="checkbox" />
            <span>오늘 다시 보지 않기</span>
          </label>
        </section>
      </div>

      <div id="augmentModal" class="augment-modal" hidden>
        <section class="augment-dialog" role="dialog" aria-modal="true" aria-labelledby="augmentTitle">
          <div class="panel-title">
            <div>
              <h2 id="augmentTitle">증강 선택</h2>
              <span id="augmentMeta"></span>
            </div>
            <div class="augment-actions">
              <button id="augmentClose" class="icon-button" title="잠시 닫기">잠시 닫기</button>
            </div>
          </div>
          <div id="augmentPanel" class="augment-panel"></div>
          <div id="selectedAugments" class="selected-augments"></div>
        </section>
      </div>

      <div id="communityBoardModal" class="community-board-modal" hidden>
        <section class="community-board-dialog" role="dialog" aria-modal="true" aria-labelledby="communityBoardTitle">
          <div class="panel-title">
            <div>
              <h2 id="communityBoardTitle">게시판</h2>
              <span id="communityBoardMeta"></span>
            </div>
            <button id="communityBoardClose" class="icon-button" title="닫기">닫기</button>
          </div>
          <div id="communityBoardPanel" class="community-board-panel"></div>
        </section>
      </div>

      <div id="traitRosterModal" class="trait-roster-modal" hidden>
        <section class="trait-roster-dialog" role="dialog" aria-modal="true" aria-labelledby="traitRosterTitle">
          <div class="panel-title">
            <div>
              <h2 id="traitRosterTitle">시너지 유닛</h2>
              <span id="traitRosterMeta"></span>
            </div>
            <button id="traitRosterClose" class="icon-button" title="닫기">닫기</button>
          </div>
          <div id="traitRosterPanel" class="trait-roster-panel"></div>
        </section>
      </div>

      <div id="traitTableModal" class="trait-table-modal" hidden>
        <section class="trait-table-dialog" role="dialog" aria-modal="true" aria-labelledby="traitTableTitle">
          <div class="panel-title">
            <div>
              <h2 id="traitTableTitle">전체 시너지 표</h2>
              <span id="traitTableMeta">시너지별 전체 기물과 보유 여부</span>
            </div>
            <button id="traitTableClose" class="icon-button" title="닫기">닫기</button>
          </div>
          <div id="traitTablePanel" class="trait-table-panel"></div>
        </section>
      </div>
    </main>

    <template id="unitTemplate">
      <button class="unit" draggable="true">
        <span class="portrait"></span>
        <span class="name"></span>
        <span class="meta"></span>
        <span class="stars"></span>
        <span class="status-badges"></span>
        <span class="hpbar"><i></i></span>
        <span class="manabar"><i></i></span>
      </button>
    </template>

    <script type="module" src="./app.js?v=20260625-shield-bar"></script>
  </body>
</html>
