<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="루미아 택틱스(블토체스·이리체스)의 버전별 랭킹, 인기 캐릭터와 덱 통계" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rumia-tatcics.onrender.com/stats.html" />
    <meta property="og:title" content="루미아 택틱스 랭킹 통계" />
    <meta property="og:description" content="블토체스·이리체스 버전별 랭킹과 인기 캐릭터 통계" />
    <meta property="og:url" content="https://rumia-tatcics.onrender.com/stats.html" />
    <meta property="og:image" content="https://rumia-tatcics.onrender.com/assets/characters/000_Dr.Nadja.png" />
    <title>루미아 택틱스 랭킹 통계 | 블토체스·이리체스</title>
    <link rel="icon" href="./assets/characters/000_Dr.Nadja.png" />
    <link rel="stylesheet" href="./stats.css" />
  </head>
  <body>
    <main class="statistics-app">
      <header class="statistics-header">
        <a class="statistics-brand" href="./index.html" aria-label="Lumia Tactics로 돌아가기">
          <span><img src="./assets/characters/000_Dr.Nadja.png" alt="" /></span>
          <div>
            <strong>Lumia Tactics</strong>
            <small>랭킹 통계</small>
          </div>
        </a>
        <div class="statistics-toolbar">
          <label>
            <span>버전</span>
            <select id="versionFilter" aria-label="통계 버전"></select>
          </label>
          <button id="refreshStatistics" class="refresh-button" type="button" title="통계 새로고침" aria-label="통계 새로고침">↻</button>
          <a class="back-button" href="./index.html">게임으로</a>
        </div>
      </header>

      <div id="statisticsStatus" class="statistics-status" role="status">랭킹 데이터를 불러오는 중입니다.</div>

      <section id="leaderDeck" class="leader-deck" aria-label="선택 버전 1위 덱"></section>

      <section id="summaryMetrics" class="summary-metrics" aria-label="통계 요약"></section>

      <section class="statistics-grid">
        <section class="statistics-panel unit-panel">
          <header class="section-header">
            <div>
              <h1>유닛 통계</h1>
              <p id="unitSampleText"></p>
            </div>
            <label class="unit-search">
              <span>검색</span>
              <input id="unitSearch" type="search" maxlength="20" placeholder="유닛 이름" autocomplete="off" />
            </label>
          </header>
          <div class="unit-table-wrap">
            <table class="unit-table">
              <thead>
                <tr>
                  <th>유닛</th>
                  <th>픽률</th>
                  <th>3성률</th>
                  <th><span class="desktop-label">평균 라운드</span><span class="mobile-label">평균R</span></th>
                </tr>
              </thead>
              <tbody id="unitStatistics"></tbody>
            </table>
          </div>
        </section>

        <aside class="statistics-side">
          <section class="statistics-panel">
            <header class="section-header compact">
              <div>
                <h2>시너지 채용률</h2>
                <p>현재 로스터 기준 활성화 비율</p>
              </div>
            </header>
            <div id="traitStatistics" class="bar-list"></div>
          </section>

          <section class="statistics-panel">
            <header class="section-header compact">
              <div>
                <h2>코스트 분포</h2>
                <p>랭킹 보드 전체 기물 기준</p>
              </div>
            </header>
            <div id="costStatistics" class="bar-list cost-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./src/stats/main.js"></script>
  </body>
</html>
